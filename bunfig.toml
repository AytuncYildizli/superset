[install]
minimumReleaseAge = 604800
# Security patch exception (Next.js RCE/DoS, 15 Oct 2026). Only next and sharp are exempt. Bun 1.3.11 (.bun-version) ignores exact-version entries like "next@16.4.1", so name entries are the narrowest that work. Remove once 16.4.1 / 0.35.5 are older than 7 days (22 Oct 2026).
minimumReleaseAgeExcludes = ["next", "sharp"]
linker = "isolated" # Prevent hoisting from resolving `path-scurry@2` to `lru-cache@6` (missing `LRUCache`), which breaks the `@superset/desktop` postinstall native rebuild.
