[install]
minimumReleaseAge = 604800
# Security patch exception (Next.js RCE/DoS, 15 Oct 2026). Remove after 22 Oct 2026.
minimumReleaseAgeExcludes = ["next", "@next/env", "@next/swc-darwin-arm64", "@next/swc-darwin-x64", "@next/swc-linux-arm64-gnu", "@next/swc-linux-arm64-musl", "@next/swc-linux-x64-gnu", "@next/swc-linux-x64-musl", "@next/swc-win32-arm64-msvc", "@next/swc-win32-x64-msvc", "sharp"]
linker = "isolated" # Prevent hoisting from resolving `path-scurry@2` to `lru-cache@6` (missing `LRUCache`), which breaks the `@superset/desktop` postinstall native rebuild.
