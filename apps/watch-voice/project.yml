name: SupersetWatchVoice
options:
  bundleIdPrefix: com.superset
targets:
  SupersetWatchVoice:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    info:
      path: SupersetWatchVoice/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
        NSMicrophoneUsageDescription: Superset needs microphone access for push-to-talk voice turns.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        WatchVoiceBaseURL: http://127.0.0.1:18787
    sources:
      - path: SupersetWatchVoice
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superset.watchvoice
        TARGETED_DEVICE_FAMILY: 4
        SWIFT_VERSION: 6.0
  SupersetWatchVoiceTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "11.0"
    sources: [SupersetWatchVoiceTests]
    dependencies: [{target: SupersetWatchVoice}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
